/* Layout idea: one exam step at a time on a calm paper column; a sticky action bar moves you forward; a side column keeps today's plan in view. */
:root{
  color-scheme: light;
  --bg:#eef1f4; --card:#ffffff; --paper:#f7f9fb; --ink:#14202b; --ink2:#4a5a6c; --line:#d3dce5; --line2:#e6ebf0;
  --accent:#0a5f7d; --accent-ink:#ffffff; --accent-soft:#dfeef4;
  --dS:#0a5f7d; --dS-soft:#dfeef4; --dG:#6a47a6; --dG-soft:#ece6f7;
  --ok:#17794a; --ok-soft:#e0f2e8; --bad:#b3261e; --bad-soft:#fbe7e5; --warn:#855400; --warn-soft:#fbf0cf;
  --shadow:0 1px 2px rgba(20,32,43,.06),0 4px 14px rgba(20,32,43,.05);
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-read:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0e151c; --card:#16202a; --paper:#1a2631; --ink:#e7eef4; --ink2:#a6b4c2; --line:#2b3a47; --line2:#223240;
    --accent:#5cc1e0; --accent-ink:#04202b; --accent-soft:#12303d;
    --dS:#5cc1e0; --dS-soft:#12303d; --dG:#b9a0ee; --dG-soft:#2a2144;
    --ok:#5fd29a; --ok-soft:#12301f; --bad:#ff8c84; --bad-soft:#3a1815; --warn:#f0c25f; --warn-soft:#312608;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0e151c; --card:#16202a; --paper:#1a2631; --ink:#e7eef4; --ink2:#a6b4c2; --line:#2b3a47; --line2:#223240;
  --accent:#5cc1e0; --accent-ink:#04202b; --accent-soft:#12303d;
  --dS:#5cc1e0; --dS-soft:#12303d; --dG:#b9a0ee; --dG-soft:#2a2144;
  --ok:#5fd29a; --ok-soft:#12301f; --bad:#ff8c84; --bad-soft:#3a1815; --warn:#f0c25f; --warn-soft:#312608;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-ui)}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
.pl{white-space:pre-line}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}

/* top */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px}
.brand .b1{font:500 12px var(--f-mono);background:var(--accent);color:var(--accent-ink);padding:2px 7px;border-radius:4px;letter-spacing:.03em}
.brand .b2{font-weight:600}
.tabs{display:flex;gap:2px}
.tab{border:0;background:none;padding:7px 13px;border-radius:8px;cursor:pointer;color:var(--ink2);font-weight:500;transition:background .15s,color .15s}
.tab:hover{background:var(--accent-soft);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.tools{margin-left:auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;color:var(--ink2);user-select:none}
.sw input{width:36px;height:20px;appearance:none;background:var(--line);border-radius:20px;position:relative;cursor:pointer;transition:background .15s;margin:0}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--card);transition:transform .15s;box-shadow:0 0 0 1px var(--line)}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{transform:translateX(16px)}
.savestate{font-size:13px;color:var(--ink2);min-width:7.5em;text-align:right}
.savestate.ok{color:var(--ok)}
.topprog{height:3px;background:var(--line2)}
.topprog i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s ease}

/* shell */
.shell{max-width:1180px;margin:0 auto;padding:22px 16px 120px;display:grid;grid-template-columns:minmax(0,1fr);gap:26px;align-items:start}
.shell.day{grid-template-columns:minmax(0,1fr)}
@media (min-width:1080px){.shell.day{grid-template-columns:minmax(0,1fr) 330px}}
.stage{min-width:0;display:grid;gap:18px;animation:enter .22s ease both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stage.still{animation:none}

/* side column */
.side{position:sticky;top:82px;display:none;gap:14px;max-height:calc(100vh - 100px);overflow:auto;align-content:start;grid-template-columns:minmax(0,1fr);min-width:0}
@media (min-width:1080px){.side{display:grid}}
.panel{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;box-shadow:var(--shadow)}
.panel h3{font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.meter{height:6px;background:var(--line2);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s ease}
.minfo{font-size:13.5px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sl{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:6px 8px;cursor:pointer;color:var(--ink);font-size:14px}
.sl:hover{background:var(--accent-soft)}
.sl.cur{background:var(--accent-soft);font-weight:600}
.sl .dot{flex:none;width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:transparent}
.sl.part .dot{border-color:var(--warn);background:var(--warn-soft)}
.sl.done .dot{border-color:var(--ok);background:var(--ok)}
.sl .rt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl .rs{font:500 12px var(--f-mono);color:var(--ink2)}
.sl .dm{flex:none;width:6px;height:16px;border-radius:3px}
.dm.S{background:var(--dS)} .dm.G{background:var(--dG)} .dm.SG{background:linear-gradient(var(--dS) 50%,var(--dG) 50%)}
.ctx{display:grid;gap:8px;font-size:14px}
.ctx b{font-weight:600}
.ctx .k.nocap{text-transform:none;letter-spacing:0}
.ctx .k{font:500 11.5px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.ctx p{color:var(--ink)}
.ctx .sd{border-left:3px solid var(--dS);padding-left:10px}
.ctx .gd{border-left:3px solid var(--dG);padding-left:10px}

/* chips */
.chip{display:inline-flex;align-items:center;font:500 11.5px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:3px 8px}
.chip.S{background:var(--dS-soft);color:var(--dS)} .chip.G{background:var(--dG-soft);color:var(--dG)}
.chip.SG{background:linear-gradient(90deg,var(--dS-soft) 50%,var(--dG-soft) 50%);color:var(--ink)}
.chip.tagc{background:var(--warn-soft);color:var(--warn);text-transform:none;letter-spacing:0}
.chip.min{background:none;color:var(--ink2);padding-left:0}

/* buttons */
.btn{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:9px;cursor:pointer;font-weight:500;transition:border-color .15s,background .15s,transform .05s}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:none}
.btn.sm{padding:5px 11px;font-size:13.5px}
.btn.big{padding:12px 22px;font-size:16.5px}

/* step header */
.stephead{display:grid;gap:10px}
.sh-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stephead h1{font:600 clamp(22px,3.4vw,28px)/1.2 var(--f-read)}
.task{display:grid;gap:6px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 16px}
.task.S{border-left-color:var(--dS)} .task.G{border-left-color:var(--dG)}
.task>p{color:var(--ink)}
.surface{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;gap:14px;box-shadow:var(--shadow)}

/* Turkish toggle */
.trbox{display:grid;gap:6px;justify-items:start}
.trbtn{background:none;border:0;padding:3px 0;color:var(--accent);cursor:pointer;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.trbtn::before{content:"";width:0;height:0;border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
.trbox.open>.trbtn::before{transform:rotate(90deg)}
.trbtn:hover{text-decoration:underline}
.tr{display:none;background:var(--warn-soft);border-left:3px solid var(--warn);border-radius:0 8px 8px 0;padding:10px 14px;width:100%;color:var(--ink);font-size:15.5px}
.trbox.open>.tr,.tr-all .tr{display:block}
.tr-all .trbtn{opacity:.55}
.trv{display:none;color:var(--ink)}
.tr-all .trv,.trv.on{display:block}

/* passage & notes */
.passage{background:var(--paper);border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:10px;padding:14px 18px;display:grid;gap:10px}
.pt{display:flex;align-items:center;justify-content:space-between;gap:8px;font:500 12px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);flex-wrap:wrap}
.pt .acts{display:flex;gap:6px}
.bi{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.bi.en-on{grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.bi.en-on{grid-template-columns:repeat(2,minmax(0,1fr))}}
.col.en{display:none;border-left:3px solid var(--dG);padding-left:12px}
.bi.en-on .col.en{display:block}
.collab{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin-bottom:4px;display:block}
.pbody{font:400 17px/1.7 var(--f-read)}
.col.en .pbody{font-size:16px;color:var(--ink2);font-family:var(--f-ui);line-height:1.65}
.para{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:start}
.para+.para{margin-top:12px}
.para .pk{font:500 13px var(--f-mono);background:var(--accent);color:var(--accent-ink);border-radius:5px;width:26px;height:26px;display:grid;place-items:center;text-transform:uppercase}
.para h4{font:600 15px var(--f-ui);margin-bottom:2px}
.note{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:grid;gap:8px}
.note .nt{font:500 12px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.note .nb{font:400 16px/1.65 var(--f-read);white-space:pre-line}
.note.pre .nb{font-family:var(--f-ui);font-size:15.5px}
details.notefold{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
details.notefold summary{cursor:pointer;font-weight:500;color:var(--accent)}
details.notefold .nb{margin-top:8px}
.spk{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:3px 9px;font:500 12px var(--f-ui);cursor:pointer;color:var(--accent);text-transform:none;letter-spacing:0;transition:border-color .15s}
.spk:hover{border-color:var(--accent)}
.spk.on{background:var(--accent-soft)}

/* items */
.item{display:grid;gap:10px}
.item+.item{border-top:1px solid var(--line2);padding-top:16px}
.q{font:500 17px/1.5 var(--f-read);max-width:70ch}
.opts{display:grid;gap:8px}
.opts.row,.opts.letters{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--card);text-align:left;width:100%;min-height:46px;transition:border-color .15s,background .15s,opacity .2s}
.opts.row .opt,.opts.letters .opt{width:auto;align-items:center}
.opt:hover:not(.lock){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font:500 12.5px var(--f-mono);color:var(--ink2);text-transform:uppercase;background:var(--paper)}
.opt .t{padding-top:2px;font-size:16px}
.opt.lock{cursor:default}
.opt.dim{opacity:.55}
.opt.right{border-color:var(--ok);background:var(--ok-soft);opacity:1}
.opt.right .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:1}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.fb{border-radius:10px;padding:11px 15px;display:grid;gap:5px;font-size:15px;animation:enter .2s ease both}
.fb.ok{background:var(--ok-soft);border-left:3px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border-left:3px solid var(--bad)}
.fb b{font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* English column items */
.qrow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.qrow .q{flex:1;min-width:0}
.enbtn{flex:none;margin-top:2px}
.enbtn[aria-pressed="true"]{background:var(--dG-soft);border-color:var(--dG)}
.col.en .q{font:500 16.5px/1.5 var(--f-ui);color:var(--ink);max-width:none}
.col.en .nb{font-family:var(--f-ui);font-size:15.5px;color:var(--ink2)}
.col.en .task p,.col.en p{margin:0}
.eopts{display:grid;gap:6px;margin-top:8px}
.eo{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:15px;color:var(--ink2);background:var(--card)}
.eo .k{flex:none;width:22px;height:22px;border-radius:5px;border:1px solid var(--line);display:grid;place-items:center;font:500 12px var(--f-mono);text-transform:uppercase;background:var(--paper);color:var(--ink2)}
.eo.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.eo.right .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.eo.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--ink)}
.eo.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.fb.en{margin-top:10px}
.enx{display:grid;gap:8px;margin-top:12px}
.enx ol{margin:0;padding-left:1.3em;display:grid;gap:10px;font-size:15px;color:var(--ink2)}
.enx ol b{color:var(--ink)}
.enl{display:block;font:400 14px/1.45 var(--f-ui);color:var(--ink2);font-style:italic;margin-top:2px}
.h1en{font:500 16px/1.4 var(--f-ui);color:var(--ink2);margin-top:-2px}

/* single-question mode */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.qdots{display:flex;gap:5px;flex-wrap:wrap}
.qd{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:none;padding:0;cursor:pointer}
.qd.ok{background:var(--ok);border-color:var(--ok)} .qd.bad{background:var(--bad);border-color:var(--bad)} .qd.cur{box-shadow:0 0 0 3px var(--accent-soft);border-color:var(--accent)}
.qn{font:500 13px var(--f-mono);color:var(--ink2)}
.qnav{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.qnav,.marks,.fb,.result{scroll-margin-bottom:96px}

/* cloze */
.cloze{background:var(--paper);border:1px solid var(--line2);border-radius:10px;padding:16px 18px;display:grid;gap:14px}
.cl-body{font:400 17px/2.05 var(--f-read);white-space:pre-line;max-width:72ch}
select.gap{font:500 15px var(--f-ui);padding:3px 4px;border:1px solid var(--accent);border-radius:6px;background:var(--card);color:var(--ink);max-width:11em;margin:0 2px;cursor:pointer}
select.gap.set{background:var(--accent-soft)}
.gapdone{display:inline;border-radius:6px;padding:1px 6px;margin:0 1px;font:400 16px/1.9 var(--f-ui);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.gapdone sup{font:500 10px var(--f-mono);margin-right:3px;opacity:.75}
.gapdone.ok{background:var(--ok-soft);color:var(--ok)}
.gapdone.bad{background:var(--bad-soft);color:var(--bad)}
.gapdone s{opacity:.8}
.bank{display:grid;gap:6px;counter-reset:none}
.bank .bs{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--card);font-size:15px;transition:opacity .2s}
.bank .bs i{font:500 12px var(--f-mono);font-style:normal;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:5px;width:24px;height:24px;display:grid;place-items:center}
.bank .bs.used{opacity:.4}
.bank .bs.is-right{border-color:var(--ok)}
.bank.words{display:flex;flex-wrap:wrap}
.eval{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.eval li{border-left:3px solid var(--bad);background:var(--bad-soft);padding:9px 13px;border-radius:0 8px 8px 0;font-size:15px}
.allok{background:var(--ok-soft);border-left:3px solid var(--ok);padding:9px 13px;border-radius:0 8px 8px 0}
details.alls{border:1px solid var(--line);border-radius:10px;padding:8px 14px}
details.alls summary{cursor:pointer;font-weight:500;color:var(--accent)}
details.alls ol{margin:10px 0 4px;padding-left:1.3em;display:grid;gap:10px;font-size:15px}
.optline{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--ink2);margin-top:3px}
.optline .okw{color:var(--ok);font-weight:600}

/* result */
.result{display:grid;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;box-shadow:var(--shadow);animation:enter .25s ease both}
.result .big{font:500 30px var(--f-mono);font-variant-numeric:tabular-nums}
.bar{height:9px;background:var(--line2);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:5px;transition:width .5s ease}
.bar.mid i{background:var(--warn)} .bar.low i{background:var(--bad)}
.review{display:grid;gap:8px}
.rv{border:1px solid var(--line);border-radius:10px;padding:9px 13px;display:grid;gap:3px;font-size:15px}
.rv.ok{border-left:4px solid var(--ok)} .rv.bad{border-left:4px solid var(--bad)}
.rv .rq{font:500 15.5px/1.45 var(--f-read)}
.rv .ra{font-size:14px;color:var(--ink2)}
.rv .ra b{color:var(--ok)} .rv .ra s{color:var(--bad)}

/* cards (vocab) */
.deck{display:grid;gap:14px}
.dtop{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ticks{display:flex;gap:3px;flex-wrap:wrap}
.tk{height:8px;flex:1;min-width:6px;max-width:26px;border-radius:3px;background:var(--line2);border:0;padding:0;cursor:pointer}
.tk.know{background:var(--ok)} .tk.new{background:var(--warn)} .tk.cur{outline:2px solid var(--accent);outline-offset:1px}
.fc{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.fc.S{border-top:5px solid var(--dS)} .fc.G{border-top:5px solid var(--dG)}
.fc-front{padding:30px 22px 22px;display:grid;gap:10px;justify-items:center;text-align:center}
.fc-de{font:600 clamp(28px,5vw,38px)/1.2 var(--f-read)}
.fc-info{color:var(--ink2);font-size:14.5px}
.fc-back{border-top:1px dashed var(--line);padding:18px 22px 20px;display:grid;gap:16px;animation:enter .22s ease both}
.cols2{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:520px){.cols2{grid-template-columns:minmax(0,1fr)}}
.cbox{border-radius:10px;padding:10px 14px;display:grid;gap:4px;align-content:start}
.cbox.en{background:var(--dG-soft)} .cbox.trb{background:var(--warn-soft)}
.cbox h4{font:500 11.5px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.cbox .w{font:500 21px/1.3 var(--f-ui)}
.cbox .ex{font-size:15.5px;line-height:1.55}
.cbox .ex.en{font-style:italic}
.exde{font:400 18px/1.6 var(--f-read);padding:0 2px}
.revbtn{border:1px dashed var(--ink2);background:none;border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--accent);font-weight:500;justify-self:start}
.marks{display:flex;gap:10px;flex-wrap:wrap}
.marks .btn{flex:1;min-width:140px}
.btn.know{border-color:var(--ok);color:var(--ok)} .btn.know:hover:not(:disabled){background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.btn.newb{border-color:var(--warn);color:var(--warn)} .btn.newb:hover:not(:disabled){background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.vtab{width:100%;border-collapse:collapse;font-size:15px}
.vtab th,.vtab td{border-top:1px solid var(--line2);padding:8px 10px;text-align:left;vertical-align:top}
.vtab th{font:500 11.5px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);border-top:0}
.vtab td:first-child{font:600 16px var(--f-read)}
.tw{overflow-x:auto}

/* listen */
.listen{background:var(--paper);border:1px solid var(--line2);border-radius:10px;padding:14px 16px;display:grid;gap:10px}
.lctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.slow{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--ink2)}
.ltext{display:grid;gap:10px;font:400 16px/1.6 var(--f-read)}
.ln{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px}
.ln b{font:500 12px var(--f-mono);color:var(--accent);padding-top:4px}
.ln .eng{display:none;font:400 15px/1.55 var(--f-ui);color:var(--ink2);border-left:3px solid var(--dG);padding-left:10px;margin-top:4px}
.ltext.show-en .ln .eng{display:block}
.hint{font-size:13.5px;color:var(--ink2)}

/* write / speak */
.helpers{border:1px solid var(--line);border-radius:10px;padding:8px 14px;background:var(--card)}
.helpers summary{cursor:pointer;font-weight:500;color:var(--accent)}
.hl{margin:10px 0 4px;padding:0;list-style:none;display:grid;gap:10px}
.hl li{display:grid;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--line2)}
.hl li:last-child{border-bottom:0}
.hl .hde{font:500 16px/1.5 var(--f-read);display:flex;justify-content:space-between;gap:8px}
.hl .hen{font-size:14.5px;color:var(--ink2);font-style:italic;display:none}
.en-vis .hl .hen{display:block}
textarea{width:100%;min-height:240px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--card);font:400 17px/1.65 var(--f-read);resize:vertical}
textarea:focus{border-color:var(--accent)}
.wc{display:flex;gap:14px;font:500 13px var(--f-mono);color:var(--ink2)}
.wc .okc{color:var(--ok)}
fieldset.checks{border:1px solid var(--line);border-radius:10px;margin:0;padding:10px 14px;display:grid;gap:7px;background:var(--card)}
fieldset.checks legend{font:500 12px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);padding:0 6px}
label.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
label.chk input{margin-top:5px;accent-color:var(--accent);width:16px;height:16px}
.model{background:var(--paper);border:1px solid var(--line2);border-left:3px solid var(--ok);border-radius:10px;padding:14px 18px;display:grid;gap:10px}
.timer{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.timer .tm{font:500 32px var(--f-mono);font-variant-numeric:tabular-nums;min-width:3.4em}
.timer .tm.over{color:var(--ok)}
.struct{margin:0;padding-left:1.3em;display:grid;gap:6px}
.struct span{display:block;color:var(--ink2);font-size:14px}
.sp-notes{min-height:90px;font:400 16px/1.5 var(--f-ui)}
select.rate{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--card)}
.lbl{font-weight:500}

/* start screen */
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;display:grid;gap:14px;box-shadow:var(--shadow)}
.hero .eyebrow{font:500 12px var(--f-mono);letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
.hero h1{font:600 clamp(28px,4.4vw,40px)/1.12 var(--f-read)}
.hero .sub{color:var(--ink2);font-size:17.5px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:108px}
.stat b{display:block;font:500 21px var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink2)}
.split{display:grid;gap:6px}
.splitbar{display:flex;height:12px;border-radius:7px;overflow:hidden;background:var(--line2)}
.splitbar i{display:block;height:100%}
.splitbar i.S{background:var(--dS)} .splitbar i.G{background:var(--dG)}
.splitleg{display:flex;gap:18px;font-size:14px;color:var(--ink2);flex-wrap:wrap}
.splitleg b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.splitleg .sw1,.splitleg .sw2{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.sw1{background:var(--dS)} .sw2{background:var(--dG)}
.learn{margin:0;padding-left:1.2em;display:grid;gap:6px}
.stlist{display:grid;gap:8px}
.st{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--card);cursor:pointer;text-align:left;width:100%;transition:border-color .15s,transform .1s}
.st:hover{border-color:var(--accent);transform:translateY(-1px)}
.st .no{font:500 13px var(--f-mono);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.st.done .no{background:var(--ok);color:#fff}
.st.part .no{background:var(--warn-soft);color:var(--warn)}
.st .ti{font-weight:600}
.st .sb{font-size:13.5px;color:var(--ink2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.st .mn{font:500 13px var(--f-mono);color:var(--ink2)}

/* action bar */
.bar-fixed{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.bar-mid{flex:1;min-width:0;display:grid;gap:5px;text-align:center}
.bar-mid .t{font-size:13.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-mid .t b{color:var(--ink);font-weight:600}
.bar-in .menu{display:inline-flex}
@media (min-width:1080px){.bar-in .menu{display:none}}
@media (max-width:520px){.bar-in .btn{padding:9px 12px}.bar-in .lbl-t{display:none}}

/* sheet */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(10,18,26,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-in{background:var(--card);width:min(560px,100%);max-height:84vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 22px;display:grid;gap:10px;animation:enter .2s ease both}
.sheet-h{display:flex;justify-content:space-between;align-items:center}

/* report & plan */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:grid;gap:12px;box-shadow:var(--shadow)}
.card h2{font:600 20px var(--f-read)}
.card h3{font:600 16px var(--f-ui)}
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.score b{font:500 46px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.score span{color:var(--ink2)}
.sk{display:grid;grid-template-columns:minmax(8em,13em) 1fr auto;gap:12px;align-items:center}
.sk .nm{font-weight:500}
.sk .nr{font:500 13px var(--f-mono);color:var(--ink2);font-variant-numeric:tabular-nums}
.weak{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.weak li{border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:grid;gap:3px}
.weak li b{display:flex;justify-content:space-between;gap:10px}
.weak li b span.c{font:500 13px var(--f-mono);color:var(--bad)}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:16px;color:var(--ink2)}
.callout{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 16px}
.repbox{width:100%;min-height:200px;font:400 14px/1.5 var(--f-mono)}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:0;padding:0;list-style:none}
.rules li{border:1px solid var(--line);border-radius:10px;padding:11px 14px;display:grid;gap:3px}

/* ===== C1-Heft =====
   A German exercise book: squared paper, red margin line, exam sheets taped in,
   Turkish help on post-its, teacher notes in red pen, rewards as stickers and stamps.
   Exam text itself stays clean and printed. */
:root,:root[data-theme="dark"]{
  color-scheme: light;
  --bg:#fbfbf6; --card:#ffffff; --paper:#fffdf6; --ink:#1d1f2c; --ink2:#575a6b; --line:#1d1f2c; --line2:#dfe6ee;
  --accent:#2148c0; --accent-ink:#ffffff; --accent-soft:#e7edff;
  --hl:#ffe14d; --hl-soft:#fff4b0; --pink:#ff8fc2; --pink-soft:#ffe1ef; --mint:#8bea9e; --mint-soft:#dcf8e2; --red:#d93a2f; --grid:#dde5ee;
  --dS:#2148c0; --dS-soft:#e7edff; --dG:#2148c0; --dG-soft:#e7edff;
  --ok:#137a43; --ok-soft:#dcf8e2; --bad:#c62f25; --bad-soft:#ffe3e0; --warn:#6b4e00; --warn-soft:#fff4b0;
  --shadow:none; --hard:4px 4px 0 var(--ink); --hard-sm:3px 3px 0 var(--ink);
  --f-ui:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-cond:"Bricolage Grotesque",system-ui,sans-serif;
  --f-read:"Literata",Georgia,serif;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --f-mono:var(--f-ui);
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:light;--bg:#fbfbf6;--card:#fff;--paper:#fffdf6;--ink:#1d1f2c;--ink2:#575a6b;--line:#1d1f2c;--line2:#dfe6ee;--accent:#2148c0;--accent-ink:#fff;--accent-soft:#e7edff;--dS:#2148c0;--dS-soft:#e7edff;--dG:#2148c0;--dG-soft:#e7edff;--ok:#137a43;--ok-soft:#dcf8e2;--bad:#c62f25;--bad-soft:#ffe3e0;--warn:#6b4e00;--warn-soft:#fff4b0}}
html{background:var(--bg)}
body{font:400 17px/1.55 var(--f-ui);color:var(--ink);
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;background-attachment:fixed}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.hw{font-family:var(--f-hand);font-weight:700}
.hint{font-size:14.5px;color:var(--ink2)}
.link{color:var(--accent)}

/* labels: plain, sentence case */
.panel h3,.ctx .k,.chip,.pt,.collab,.note .nt,.cbox h4,.vtab th,fieldset.checks legend,.hero .eyebrow,.exam th,.wk-top .k,.dtab th,.dc .k,.gll,.gcl,.mockbar .mk,.mockres .mk,.mockov .mk,.bank .bs i,.opt .k,.eo .k,.st .mn,.sl .rs,.para .pk,.sk .nr,.weak li b span.c,.wd .f,.glchip b,.result .big,.score b{
  text-transform:none;letter-spacing:0;font-family:var(--f-ui)}
.chip{font:600 13.5px var(--f-ui);padding:2px 9px;border-radius:999px;background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.chip.min{border:0;background:none;color:var(--ink2)}
.chip.mockc{background:var(--ink);color:var(--hl);border-color:var(--ink)}
.chip.S,.chip.G,.chip.SG{display:none}
.chip.tagc{background:var(--hl-soft);border-color:var(--ink);color:var(--ink)}

/* ---------- buttons: stickers you can press ---------- */
.btn{font:600 16px var(--f-ui);border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:12px;box-shadow:var(--hard-sm);transition:transform .08s,box-shadow .08s}
.btn:hover:not(:disabled){border-color:var(--ink);color:var(--ink);transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--hl);border-color:var(--ink);color:var(--ink);font-weight:800}
.btn.primary:hover:not(:disabled){filter:none;color:var(--ink)}
.btn.big{font:800 20px/1.1 var(--f-ui);padding:14px 26px;border-radius:14px;box-shadow:var(--hard)}
.btn.sm{font-size:14.5px;padding:5px 12px;box-shadow:2px 2px 0 var(--ink)}
.btn.ghost{background:#fff}
.btn:disabled{box-shadow:none}

/* ---------- header: notebook label + index tabs ---------- */
.top{position:relative;background:transparent;border:0;backdrop-filter:none}
.top-in{max-width:1120px;padding:16px 18px 6px;gap:12px 18px;align-items:center}
.logo{all:unset;cursor:pointer;display:inline-flex;align-items:baseline;gap:4px;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:4px 14px 6px;box-shadow:var(--hard-sm);transform:rotate(-2deg)}
.logo:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.logo .l1{font:800 26px/1 var(--f-ui)}
.logo .l2{font:700 28px/1 var(--f-hand);color:var(--red)}
.tabs{gap:6px;flex-wrap:wrap}
.top .tab{font:700 17px var(--f-ui);color:var(--ink);padding:7px 14px;border-radius:10px 10px 4px 4px;border:2px solid transparent;background:transparent}
.top .tab:hover{background:#fff;border-color:var(--ink);color:var(--ink)}
.top .tab[aria-current="page"]{border-color:var(--ink);box-shadow:var(--hard-sm);color:var(--ink)}
.top .tab.t-y[aria-current="page"]{background:var(--hl)} .top .tab.t-g[aria-current="page"]{background:var(--mint)}
.top .tab.t-p[aria-current="page"]{background:var(--pink)} .top .tab.t-b[aria-current="page"]{background:#9cc2ff}
.tools{gap:10px 14px}
.daysel select{font:600 15px var(--f-ui);color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:10px;padding:6px 10px}
.sw{font:700 15px var(--f-ui);color:var(--ink)}
.sw input{width:38px;height:22px;background:#fff;border:2px solid var(--ink)}
.sw input::after{top:2px;left:2px;width:14px;height:14px;background:var(--ink);box-shadow:none}
.sw input:checked{background:var(--hl)}
.sw input:checked::after{transform:translateX(16px)}
.savestate{font:700 17px var(--f-hand);color:var(--ink2);min-width:0}
.savestate.ok{color:var(--ok)}
.topprog{display:none}

/* ---------- page frame with the red margin line ---------- */
.shell,.shell.day{max-width:1120px;grid-template-columns:minmax(0,1fr) !important;padding:18px 18px 130px;position:relative}
@media (min-width:900px){.shell,.shell.day{padding-left:70px}.shell::before{content:"";position:absolute;left:38px;top:0;bottom:0;width:2px;background:#f19a9a;opacity:.9}}
.side{display:none !important}
.stage{gap:22px;animation:none}

/* ---------- home ---------- */
.home{display:grid;gap:24px}
.pg-head{position:relative;display:grid;gap:4px;padding-right:120px}
.pg-head .date{font-size:28px;color:var(--accent);margin:0;transform:rotate(-1deg);transform-origin:left}
.pg-head h1{font:800 clamp(40px,7vw,76px)/.98 var(--f-ui);letter-spacing:-.025em;margin-top:4px}
.hlt{background:linear-gradient(transparent 52%,var(--hl) 52%,var(--hl) 90%,transparent 90%);padding:0 .08em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.pg-head .sub{font-size:18px;color:var(--ink2)}
.stamp-day{position:absolute;right:4px;top:6px;font:800 22px/1 var(--f-ui);color:var(--red);border:3px solid var(--red);border-radius:12px;padding:10px 14px;transform:rotate(8deg);opacity:.88;letter-spacing:.02em;background:rgba(255,255,255,.6)}
.home-grid{display:grid;gap:22px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:900px){.home-grid{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}}

.missions{background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--ink);padding:18px 20px 20px;display:grid;gap:12px}
.mh-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mh-row h2{font:800 26px/1.1 var(--f-ui);letter-spacing:-.01em}
.mh-row .cnt{font-size:24px;color:var(--accent)}
.mlist{list-style:none;margin:0;padding:0;display:grid}
.ms button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1.5px dashed var(--grid)}
.ms:last-child button{border-bottom:0}
.ms button:hover{background:var(--hl-soft)}
.ms button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.ms .box{width:26px;height:26px;border:2.5px solid var(--ink);border-radius:5px;display:grid;place-items:center;font:700 24px/1 var(--f-hand);color:var(--ok);background:#fff}
.ms.part .box{background:linear-gradient(135deg,var(--hl) 50%,#fff 50%)}
.ms.done .box{background:var(--mint-soft)}
.ms .mti{display:block;font:700 17.5px/1.25 var(--f-ui)}
.ms.done .mti{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px;color:var(--ink2)}
.ms .mex{display:block;font-size:14.5px;color:var(--ink2)}
.ms .xp{font:700 22px/1 var(--f-hand);color:var(--accent);white-space:nowrap}
.ms.done .xp{color:var(--ok)}
.bosstag{display:inline-block;font:800 12.5px/1 var(--f-ui);letter-spacing:.04em;background:var(--ink);color:var(--hl);border-radius:6px;padding:4px 7px;transform:rotate(-4deg)}
.ms.boss .mti::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);margin-right:7px;vertical-align:2px}
.go-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-top:6px}
.go-row .hw{font-size:23px;color:var(--ink2)}

.stack{display:grid;gap:18px}
.rednote{background:#fff;border:2px solid var(--ink);border-radius:4px;padding:12px 16px 14px;transform:rotate(1.2deg);box-shadow:var(--hard-sm);background-image:linear-gradient(#fff 31px,#f3b0b0 31px,#f3b0b0 33px,#fff 33px)}
.rn-h{font:800 14px var(--f-ui);color:var(--red)}
.rednote p{color:var(--red);font-size:24px;line-height:1.15;margin-top:8px}
.lvl{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:14px 16px;display:grid;gap:8px;box-shadow:var(--hard-sm)}
.lvl-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lvl .lv{font:800 24px/1 var(--f-ui)}
.lvl .rk{font:700 26px/1 var(--f-hand);color:var(--accent)}
.pencil{position:relative;height:22px;border:2px solid var(--ink);border-radius:4px 14px 14px 4px;background:#fff;overflow:hidden}
.pencil i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--hl) 0 18px,#ffd21f 18px 20px);border-right:2px solid var(--ink)}
.lvl-sub{font-size:15px;color:var(--ink2)} .lvl-sub b{color:var(--ink)}
.chain{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:14px 16px;display:grid;gap:10px;box-shadow:var(--hard-sm)}
.ch-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ch-top span{font:800 20px var(--f-ui)} .ch-top b{font-size:24px;color:var(--red)}
.ch-row{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.cd{position:relative;aspect-ratio:1;border:2px solid var(--ink);border-radius:5px;display:grid;place-items:center;background:#fff}
.cd i{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font:600 11px var(--f-ui);font-style:normal;color:var(--ink2)}
.cd b{font:700 30px/1 var(--f-hand);color:var(--red);transform:rotate(-6deg)}
.cd.today{border-color:var(--red);border-style:dashed;background:var(--pink-soft)}
.cd.done{background:var(--hl-soft)}
.chain .hint{margin-top:12px}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mini{border:2px solid var(--ink);border-radius:50%;aspect-ratio:1;display:grid;place-content:center;text-align:center;background:#fff;box-shadow:var(--hard-sm);padding:6px}
.mini b{font:800 32px/1 var(--f-ui)} .mini span{font:600 12.5px/1.15 var(--f-ui);color:var(--ink2)}
.mini.m1{background:var(--pink);transform:rotate(-5deg)} .mini.m2{background:var(--mint);transform:rotate(3deg)} .mini.m3{background:#9cc2ff;transform:rotate(-2deg)}
.home>.mockov{background:var(--ink);color:#fff;border:2px solid var(--ink);border-radius:14px;padding:16px 20px;box-shadow:6px 6px 0 var(--hl)}
.home>.mockov .mk{font:800 20px var(--f-ui);color:var(--hl)}
.home>.mockov li span:nth-child(2){color:rgba(255,255,255,.7)}
.home>.mockov .hint{color:rgba(255,255,255,.75)}
details.more{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:12px 18px}
details.more summary{cursor:pointer;font:700 17px var(--f-ui)}
details.more[open]{display:grid;gap:12px}
.learn li::marker{color:var(--red)}

/* ---------- step view: HUD + taped exam sheet ---------- */
.stepv{max-width:860px;width:100%;margin:0 auto}
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hb{font:700 15px var(--f-ui);border:2px solid var(--ink);background:#fff;border-radius:999px;padding:5px 14px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.hb:hover{background:var(--hl-soft)}
.hs{font:700 16px var(--f-ui)} .hs b{font-weight:800}
.hx{margin-left:auto;font:700 22px/1 var(--f-hand);color:var(--accent)}
.paper{position:relative;background:#fff;border:1px solid #cfd5dc;border-radius:3px;padding:30px 30px 34px;box-shadow:0 1px 0 #cfd5dc,0 14px 30px -18px rgba(29,31,44,.45);display:grid;gap:18px}
.paper::before,.paper::after{content:"";position:absolute;top:-12px;width:96px;height:26px;background:rgba(255,225,77,.55);border:1px solid rgba(29,31,44,.08);transform:rotate(-4deg)}
.paper::before{left:28px} .paper::after{right:28px;transform:rotate(5deg);background:rgba(255,143,194,.45)}
.paper.boss{border-top:8px solid var(--ink)}
@media (max-width:640px){.paper{padding:24px 16px 26px}.paper::before,.paper::after{width:70px}}
.stephead{gap:10px}
.stephead h1{font:800 clamp(28px,4.6vw,40px)/1.05 var(--f-ui);letter-spacing:-.02em}
.h1en{font:500 17px var(--f-ui);color:var(--ink2)}
.task,.task.S,.task.G{background:#fff;border:0;border-left:5px solid var(--ink);border-radius:0;padding:4px 0 4px 16px}
.task .pl{font-weight:500}
.col.en,.collab{color:var(--ink2)}
.collab{font:700 18px var(--f-hand);color:var(--accent)}
.paper .surface,.paper .card{background:transparent;border:0;border-radius:0;padding:0;box-shadow:none}
#body{display:grid;gap:18px}

/* Turkish help = post-it */
.trbtn{font:700 19px var(--f-hand);color:var(--red)}
.tr{background:#fff1a8;border:0;border-radius:2px;padding:12px 16px;box-shadow:2px 4px 10px -4px rgba(29,31,44,.35);transform:rotate(-.6deg);font-size:16px}
.tr-all .tr{transform:none}

/* reading material */
.passage,.cloze,.listen{background:#fff;border:0;border-left:4px solid var(--grid);border-radius:0;padding:4px 0 4px 18px}
.passage .pl,.cloze .ctx,.para p{font-family:var(--f-read)}
.pt{font:700 16px var(--f-ui);color:var(--ink)}
.spk{border:1.5px solid var(--ink);border-radius:999px;color:var(--ink);background:#fff;font:600 13px var(--f-ui)}
.spk.on{background:var(--hl)}
.para .pk{background:var(--ink);color:var(--hl);border-radius:50%}
.note{border-left:4px solid var(--accent)}

/* answers */
.opt{border:2px solid var(--ink);border-radius:12px;background:#fff;box-shadow:2px 2px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.opt:hover:not(.lock){background:var(--hl-soft);border-color:var(--ink)}
.opt:active:not(.lock){transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.opt .k{border:2px solid var(--ink);border-radius:50%;font:800 14px var(--f-ui);color:var(--ink);background:#fff}
.opt.chosen{background:var(--hl);box-shadow:none;transform:translate(2px,2px)}
.opt.chosen .k{background:var(--ink);color:var(--hl)}
.opt.lock{box-shadow:none}
.opt.right{background:var(--mint-soft);border-color:var(--ok)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--bad-soft);border-color:var(--red)}
.opt.wrong .k{background:var(--red);border-color:var(--red);color:#fff}
.opt.wrong .t{text-decoration:line-through;text-decoration-color:var(--red)}
.fb{border-radius:10px;font-size:15.5px}
.fb.ok{background:var(--mint-soft);border-left:4px solid var(--ok)}
.fb.bad{background:#fff;border:2px solid var(--red);border-left-width:6px}
.fb.bad b{color:var(--red)}
select.gap{font:600 15.5px var(--f-ui);border:0;border-bottom:2.5px solid var(--ink);border-radius:4px 4px 0 0;background:var(--hl-soft);padding:2px 4px}
select.gap.set{background:var(--hl)}
.gapdone.ok{background:var(--mint-soft);color:var(--ok)}
.gapdone.bad{background:var(--bad-soft);color:var(--bad)}
.bank .bs{border:2px solid var(--ink);border-radius:10px;background:#fff}
.bank .bs i{background:var(--ink);color:var(--hl);border-radius:50%}
.bank .bs.used{opacity:.35}
.qd{border:2px solid var(--ink)} .qd.cur{box-shadow:0 0 0 3px var(--hl)}
.result,.mockres{background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:var(--hard)}
.result .big,.mockres .big{font:800 34px/1 var(--f-ui)}
.bar,.meter{height:12px;border:2px solid var(--ink);border-radius:999px;background:#fff}
.bar i,.meter i{background:var(--mint);border-radius:999px}
.bar.mid i{background:var(--hl)} .bar.low i{background:var(--pink)}

/* mock exam stopwatch */
.mockbar{top:8px;background:var(--ink);color:#fff;border:0;border-radius:14px;box-shadow:4px 4px 0 var(--hl)}
.mockbar .mk{font:800 16px var(--f-ui);color:var(--hl)}
.mockbar .mt{font:800 32px/1 var(--f-ui);color:#fff;font-variant-numeric:tabular-nums}
.mockbar .mt.over{color:var(--pink)}
.mockbar .mp{font:600 14px var(--f-ui)}
.mockres{border-left:8px solid var(--ink)}
.mockres .mk{font:800 16px var(--f-ui);color:var(--accent)}
.mockover{background:var(--bad-soft);color:var(--red);border:2px solid var(--red)}
.mockwarn{background:var(--hl-soft);border:2px solid var(--ink)}

/* vocabulary cards: index cards */
.fc{background:#fff;border:2px solid var(--ink);border-radius:6px;box-shadow:6px 6px 0 var(--ink);background-image:linear-gradient(#fff 54px,#f3b0b0 54px,#f3b0b0 56px,#fff 56px)}
.fc.S,.fc.G{border-top:2px solid var(--ink)}
.fc-de{font:800 clamp(32px,6vw,48px)/1.1 var(--f-ui);letter-spacing:-.02em}
.fc-back{border-top:2px dashed var(--grid)}

/* bottom controls */
.bar-fixed{background:transparent;border:0;backdrop-filter:none;pointer-events:none}
.bar-in{max-width:860px;pointer-events:auto;background:#fff;border:2px solid var(--ink);border-radius:18px;box-shadow:var(--hard);margin:0 auto 12px;padding:8px 10px}
@media (max-width:900px){.bar-in{margin:0 10px 10px}}
.bar-mid .t{font:600 14.5px var(--f-ui);color:var(--ink2)} .bar-mid .t b{color:var(--ink)}
.bar-in .menu{display:inline-flex}
.bar-fixed .btn{box-shadow:2px 2px 0 var(--ink)}
.sheet{background:rgba(29,31,44,.45)}
.sheet-in{border:2px solid var(--ink);border-bottom:0}
.sheet-in .st{border:2px solid var(--ink);border-radius:12px;box-shadow:2px 2px 0 var(--ink)}
.st .no{border:2px solid var(--ink);background:#fff;color:var(--ink)}
.st.done .no{background:var(--mint);color:var(--ink)}
.st.part .no{background:var(--hl);color:var(--ink)}

/* ---------- report card (Karne) ---------- */
.card{background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:var(--hard-sm)}
.card h2,.surface h2{font:800 24px/1.15 var(--f-ui);letter-spacing:-.01em}
.zeugnis{position:relative;box-shadow:6px 6px 0 var(--ink);gap:16px}
.z-t{font:700 26px var(--f-hand);color:var(--accent)}
.zeugnis h1{font:800 clamp(30px,5vw,46px)/1.02 var(--f-ui);letter-spacing:-.02em}
.z-body{display:flex;flex-wrap:wrap;align-items:center;gap:18px 26px}
.z-grade{display:flex;align-items:center;gap:12px}
.z-n{width:92px;height:92px;border:4px solid var(--red);border-radius:50%;display:grid;place-items:center;font:700 66px/1 var(--f-hand);color:var(--red);transform:rotate(-8deg)}
.z-l{font:700 15px/1.2 var(--f-ui)} .z-l small{font-weight:500;color:var(--ink2)}
.z-facts{display:flex;flex-wrap:wrap;gap:10px 22px}
.z-facts div{display:grid} .z-facts b{font:800 24px/1.1 var(--f-ui)} .z-facts span{font-size:14px;color:var(--ink2)}
.stamp{margin-left:auto;font:800 22px/1 var(--f-ui);text-transform:uppercase;letter-spacing:.06em;border:4px double currentColor;border-radius:10px;padding:10px 14px;transform:rotate(-10deg);opacity:.9}
.stamp.ok{color:var(--ok)} .stamp.no{color:var(--red)}
.verdict{font-size:26px;line-height:1.15;color:var(--red)}
.sk .nm{font-weight:600}
.weak li,.rv,.rules li,.wd>div{border:2px solid var(--ink);border-radius:12px;background:#fff}
.rv.bad{border-left:7px solid var(--red)} .rv.ok{border-left:7px solid var(--ok)}
.weak li b span.c{color:var(--red);font-weight:700}
.callout{background:var(--hl-soft);border:2px solid var(--ink);border-radius:12px}
.repbox{font:400 14px/1.5 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--ink);border-radius:10px}
.errc{background:var(--bad-soft);border:2px solid var(--red);padding:9px 13px;border-radius:10px}
.allok{background:var(--mint-soft);border:2px solid var(--ok);border-radius:10px}
.bkrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.bkrow label.btn{position:relative;cursor:pointer}
.score b{font:800 50px/1 var(--f-ui)}

/* ---------- plan: the map ---------- */
.card.intro h1{font:800 clamp(30px,5vw,46px)/1.02 var(--f-ui);letter-spacing:-.02em}
.map{gap:14px}
.mws{display:grid;gap:10px}
.mw{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;align-items:center}
.wl{font:700 22px/1 var(--f-hand);color:var(--accent)}
.wc{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.md{all:unset;box-sizing:border-box;position:relative;min-height:62px;border:2px solid var(--ink);border-radius:10px;background:#fff;padding:6px 8px;display:grid;align-content:space-between;gap:2px}
button.md{cursor:pointer;box-shadow:2px 2px 0 var(--ink)} button.md:hover{background:var(--hl-soft)} button.md:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.md .dn{font:800 18px/1 var(--f-ui)}
.md .bz{position:absolute;right:6px;top:6px;font:800 10.5px/1 var(--f-ui);background:var(--ink);color:var(--hl);border-radius:4px;padding:3px 5px}
.md .ok{position:absolute;right:8px;bottom:2px;font:700 34px/1 var(--f-hand);color:var(--ok)}
.md .sc{font:600 12.5px var(--f-ui);color:var(--ink2)}
.md.future{border-style:dashed;border-color:#9aa3b2;background:rgba(255,255,255,.6)} .md.future .dn{color:#9aa3b2}
.md.cur{background:var(--hl);box-shadow:3px 3px 0 var(--ink)}
.md.done{background:var(--mint-soft)}
.md.isboss.future{border-color:var(--ink);border-style:dashed}
.goal-flag{justify-self:end;font:800 22px/1 var(--f-ui);background:var(--ink);color:var(--hl);border-radius:10px;padding:12px 18px;box-shadow:4px 4px 0 var(--pink);transform:rotate(-2deg)}
.goal-flag small{display:block;margin-top:5px;font:700 14px/1 var(--f-ui);color:#fff}
/* phases on the map: a hand-written divider, like a new chapter in the exercise book */
.mph{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-top:8px;padding-bottom:4px;border-bottom:2px dashed #f19a9a}
.mph:first-child{margin-top:0}
.mph .pn{font:700 26px/1 var(--f-hand);color:var(--red)} .mph b{font:800 18px var(--f-ui)} .mph [lang]{color:var(--ink2);font-size:14px}
.mph .pd{margin-left:auto;font:600 13.5px var(--f-ui);color:var(--ink2)}
.md .bz.big{background:var(--red);color:#fff}
.md.isbig{border-color:var(--red)} .md.isbig.future{border-color:var(--red);border-style:dashed}
.mbuf{border:2px dashed var(--ink2);border-radius:10px;padding:8px 12px;font-size:14.5px;color:var(--ink2);background:rgba(255,255,255,.7)} .mbuf b{color:var(--ink)}
.ch-row.wks{grid-template-columns:repeat(8,minmax(0,1fr))}
.cd.wk b{font-size:28px;transform:rotate(-4deg)} .cd.wk.done{background:var(--mint-soft)} .cd.wk.done b{color:var(--ok)}
.cd.wk i{font-size:10.5px}
/* plan: road to the exam */
.road{display:grid;gap:12px}
.road h3{font:800 18px var(--f-ui);margin-top:6px}
.phases{list-style:none;margin:0;padding:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.ph{position:relative;border:2px solid var(--ink);border-radius:12px;padding:12px 14px;background:#fff;display:grid;gap:6px;align-content:start}
.ph p{margin:0;font-size:15px}
.ph-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px} .ph-h b{font:800 18px var(--f-ui)} .ph-h [lang]{font-size:13.5px;color:var(--ink2)}
.ph .pn{font:700 24px/1 var(--f-hand);color:var(--red)}
.ph .pd{font:600 13.5px var(--f-ui);color:var(--ink2)}
.ph .tg{border-top:2px dashed var(--line2);padding-top:6px;font-weight:600} .ph .tg span{font:700 18px var(--f-hand);color:var(--accent);margin-right:4px}
.ph.now{background:var(--hl-soft);box-shadow:3px 3px 0 var(--ink)}
.ph.now::after{content:"şu an";position:absolute;top:-12px;right:12px;font:700 20px/1 var(--f-hand);color:#fff;background:var(--red);padding:3px 9px 4px;border-radius:6px;transform:rotate(3deg)}
.ph.buf{border-style:dashed;background:rgba(255,255,255,.7);grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.ph .nw{white-space:nowrap}
.md .bz.bil{background:#fff;color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.miles{list-style:none;margin:0;padding:0 0 0 18px;border-left:3px solid var(--ink);display:grid;gap:8px}
.miles li{position:relative;display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;align-items:baseline;font-size:15px}
.miles li::before{content:"";position:absolute;left:-26px;top:5px;width:11px;height:11px;border:2px solid var(--ink);border-radius:50%;background:#fff}
.miles .hw{font-size:21px;line-height:1.1;color:var(--ink2)}
.miles li.bg::before{background:var(--red);border-color:var(--red)} .miles li.bg .hw{color:var(--red)}
.miles li.rg::before{background:var(--pink)} .miles li.rg span:last-child{background:var(--pink-soft);border-radius:6px;padding:2px 6px}
.miles li.ex::before{background:var(--hl);width:15px;height:15px;left:-28px;top:3px}
.miles li.ex span:last-child{font-weight:800}
.pill.pbig{border-color:var(--red);color:var(--red)} .pill.pbig[aria-pressed="true"]{background:var(--red);color:#fff;border-color:var(--red)}
@media (max-width:640px){.miles li{grid-template-columns:minmax(0,1fr)}.mph .pd{margin-left:0;width:100%}}
.srsrow b{font:800 20px var(--f-ui)}
.skel{border:2px solid var(--ink);border-radius:999px;overflow:hidden;height:16px}
.skel i:nth-child(odd){background:var(--hl)} .skel i:nth-child(even){background:var(--pink)}
.pill{border:2px solid var(--ink);color:var(--ink);font-weight:700}

<noscript>Bu site JavaScript gerektirir.</noscript>
<div id="app"></div>
<script>window.DAYS = window.DAYS || {};</script>
<script src="data/seed.js?v=1"></script>
<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LET = 'abcdefgh';
const KEY = 'linie-c1-v1';
const SCHEMA = 2;
const TTS = typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const DOMLBL = { S: 'Sektör', G: 'Genel C1', SG: 'Sektör + Genel' };
const WEEKDAYS = ['Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma'];

/* ---------- state ---------- */
let state = { v: SCHEMA, days: {} };
const ui = { view: 'day', day: null, rpos: undefined, busy: false, glErr: false, step: -1, trAll: false, en: true, sheet: false, tro: {}, eno: {}, q: {}, planWeek: 1, order: null, flip: false, trCard: false, sumShown: false, glDay: null, glQ: '', glDom: '', glCover: '' };
let db = null, saving = false, again = false, saveTimer = null;
const dirtyDays = new Set();

function D(id) {
  id = id || ui.day;
  if (!state.days[id]) state.days[id] = {};
  const d = state.days[id];
  d.sel = d.sel || {}; d.res = d.res || {}; d.secs = d.secs || {}; d.vocab = d.vocab || {}; d.write = d.write || {}; d.speak = d.speak || {}; d.time = d.time || {}; d.rev = d.rev || {}; d.seenNew = d.seenNew || {}; d.mockT = d.mockT || {}; d.plays = d.plays || {};
  if (typeof d.card !== 'number') d.card = 0;
  if (typeof d.notes !== 'string') d.notes = '';
  if (!d.started) d.started = Date.now();
  return d;
}
function loadLocal() { try { const s = localStorage.getItem(KEY); if (s) { const p = JSON.parse(s); if (p && p.days) state = p; } } catch (e) {} }
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function setStatus(kind) {
  const el = $('#savestate'); if (!el) return;
  const m = { saving: ['Kaydediliyor…', ''], synced: ['Kaydedildi', 'ok'], local: ['Bu cihazda kayıtlı', 'ok'], none: ['', ''] }[kind] || ['', ''];
  el.textContent = m[0]; el.className = 'savestate ' + m[1];
}
let lastStatus = 'none';
function status(k) { lastStatus = k; setStatus(k); }
function queueSave(id) {
  id = id || ui.day;
  D(id).updatedAt = new Date().toISOString();
  if (DAYS[id]) { try { D(id).sum = summary(id); } catch (e) {} }
  dirtyDays.add(id); saveLocal();
  if (!db) { status('local'); return; }
  status('saving');
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 900);
}
async function flush() {
  if (!db) return;
  if (saving) { again = true; return; }
  saving = true;
  try {
    for (const id of Array.from(dirtyDays)) {
      if (!DAYS[id]) { try { await ensureDay(id); } catch (e) { continue; } }
      dirtyDays.delete(id); await db.doc('days/' + id).set(buildDoc(id));
    }
    status('synced');
  } catch (e) { status('local'); }
  saving = false;
  if (again || dirtyDays.size) { again = false; flush(); }
}
function buildDoc(id) {
  const d = JSON.parse(JSON.stringify(D(id)));
  delete d.sum;
  d.schema = SCHEMA; d.no = DAYS[id].no; d.day = id; d.week = DAYS[id].week;
  d.summary = summary(id);
  d.updatedAt = d.updatedAt || new Date().toISOString();
  return d;
}
async function initDb() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') { status('local'); return; }
    const dbh = await window.claude.use('db');
    if (!dbh) { status('local'); return; }
    db = dbh;
    let changed = false;
    for (const id of dayIds()) {
      const snap = await db.doc('days/' + id).get();
      const r = snap.exists ? (snap.data() || {}) : null;
      const usable = r && r.schema === SCHEMA;
      const l = D(id);
      if (usable) {
        if (!l.updatedAt || (r.updatedAt && r.updatedAt > l.updatedAt)) {
          const keep = {}; ['sel', 'res', 'secs', 'vocab', 'seenNew', 'rev', 'deckVer', 'write', 'speak', 'time', 'mockT', 'card', 'notes', 'started', 'updatedAt', 'closed'].forEach(k => { if (r[k] !== undefined) keep[k] = r[k]; });
          if (r.summary) keep.sum = r.summary;
          state.days[id] = keep; D(id); migrateDay(id); changed = true;
        } else if (l.updatedAt && (!r.updatedAt || l.updatedAt > r.updatedAt)) dirtyDays.add(id);
      } else if (Object.keys(l.res).length || Object.keys(l.vocab).length || Object.keys(l.sel).length || Object.keys(l.rev).length) dirtyDays.add(id);
    }
    saveLocal(); status('synced');
    if (dirtyDays.size) flush();
    if (changed) render();
  } catch (e) { status('local'); }
}

/* ---------- manifest + lazy day files ---------- */
const MAN = () => window.MANIFEST || { days: [] };
const MD = id => MAN().days.find(x => x.id === id);
const mDays = () => MAN().days.slice().sort((a, b) => a.no - b.no);
const dayIds = () => mDays().map(x => x.id);
const liveDays = () => mDays().filter(m => !m.archive);
const liveIds = () => liveDays().map(x => x.id);
const LD = id => { const m = MD(id); return m && !m.archive ? m : null; };
const loadingDays = {};
function loadScript(src, v) {
  return new Promise((res, rej) => {
    const add = (u, fallback) => {
      const s = document.createElement('script'); s.src = u; s.async = true;
      s.onload = () => res();
      s.onerror = () => { s.remove(); if (fallback) add(fallback, null); else rej(new Error(src)); };
      document.head.appendChild(s);
    };
    add(v ? src + '?v=' + encodeURIComponent(v) : src, v ? src : null);
  });
}
function ensureDay(id) {
  if (DAYS[id]) return Promise.resolve(DAYS[id]);
  const m = MD(id); if (!m) return Promise.reject(new Error(id));
  if (!loadingDays[id]) loadingDays[id] = loadScript(m.file, m.v).then(() => { if (!DAYS[id]) throw new Error(id); migrateDay(id); return DAYS[id]; }).catch(e => { delete loadingDays[id]; throw e; });
  return loadingDays[id];
}
const ensureDays = ids => Promise.all(ids.map(ensureDay));
function migrateDay(id) {
  const day = DAYS[id]; if (!day) return;
  const d = D(id), v = day.deckVer || 1;
  if ((d.deckVer || 1) !== v) { d.vocab = {}; d.seenNew = {}; d.card = 0; d.deckVer = v; }
}
function pickStartDay() {
  const ids = liveIds(), cur = MAN().current && LD(MAN().current) ? MAN().current : ids[ids.length - 1];
  try { const s = JSON.parse(localStorage.getItem(KEY + ':day') || 'null'); if (s && s.cur === cur && LD(s.day)) return s.day; } catch (e) {}
  return cur;
}
function rememberDay(id) { try { localStorage.setItem(KEY + ':day', JSON.stringify({ day: id, cur: MAN().current })); } catch (e) {} }
function openDay(id, view) {
  stopSpeech();
  ui.busy = true; ui.view = view || 'day'; render();
  ensureDay(id).then(() => {
    ui.day = id; ui.step = -1; ui.q = {}; ui.order = null; ui.flip = false; ui.rpos = undefined; ui.sheet = false; ui.busy = false; ui.glDay = id;
    rememberDay(id); render(); window.scrollTo(0, 0);
  }).catch(() => { ui.busy = false; render(); });
}

/* ---------- spaced repetition: 1-3-7-14 (study days) ---------- */
const SRS = [1, 3, 7, 14];
const SRS_CAP = 30;
const isNewMark = (d, i) => !!((d.seenNew && d.seenNew[i]) || (d.vocab && d.vocab[i] === 'new'));
const wrongWord = (d, w) => !!(w && w.q && d.res && w.q.some(id => d.res[id] && !d.res[id].ok));
function srsBuild(uptoNo) {
  const items = {};
  mDays().forEach(m => {
    if (m.no > uptoNo) return;
    const st = state.days[m.id] || {};
    const rev = st.rev || {};
    Object.keys(rev).forEach(k => {
      const it = items[k]; if (!it || it.done || it.due > m.no) return;
      if (rev[k] === 'know') {
        it.step++; it.hist.push([m.no, 1]);
        if (it.step >= SRS.length) { it.done = true; it.doneOn = m.no; }
        else it.due = Math.max(it.start + SRS[it.step], m.no + 1);
      } else { it.start = m.no; it.step = 0; it.due = m.no + 1; it.lapses++; it.hist.push([m.no, 0]); }
    });
    (m.words || []).forEach((w, i) => {
      if (!isNewMark(st, i) && !wrongWord(st, w)) return;
      const k = m.id + ':' + i;
      if (!items[k]) items[k] = { k, w, day: m.id, origin: m.no, start: m.no, step: 0, due: m.no + 1, lapses: 0, hist: [] };
    });
  });
  return items;
}
function srsQueue(no) {
  return Object.values(srsBuild(no - 1)).filter(it => !it.done && it.due <= no)
    .sort((a, b) => a.due - b.due || a.origin - b.origin || a.k.localeCompare(b.k, undefined, { numeric: true })).slice(0, SRS_CAP);
}
function srsStats(no) {
  const all = Object.values(srsBuild(no));
  return { active: all.filter(x => !x.done).length, learned: all.filter(x => x.done).length, next: all.filter(x => !x.done && x.due <= no + 1).length };
}

/* ---------- data helpers ---------- */
function curDay() { return DAYS[ui.day]; }
function curSec() { return ui.step >= 0 ? curDay().sections[ui.step] : null; }
function clozeContext(text, n) {
  const m = text.match(new RegExp('([^\\n]{0,40})\\{' + n + '\\}([^\\n]{0,28})'));
  if (!m) return '';
  let pre = m[1], post = m[2];
  if (pre.length === 40) pre = pre.replace(/^\S+\s+/, '');
  if (post.length === 28) post = post.replace(/\s+\S*$/, '');
  return ('… ' + pre.replace(/\{\d+\}/g, '___') + '___' + post.replace(/\{\d+\}/g, '___') + ' …').replace(/\s+/g, ' ');
}
function itemsOf(sec) {
  const out = [];
  (sec.blocks || []).forEach(b => {
    if (b.type === 'mc') out.push({ id: sec.id + '_' + b.id, kind: 'mc', b, a: b.a, opts: b.opts, tag: b.tag, dom: b.dom || (sec.dom !== 'SG' ? sec.dom : null), exp: b.exp, q: b.q, letters: !!b.letters });
    else if (b.type === 'cloze') b.gaps.forEach((g, i) => {
      out.push({ id: sec.id + '_' + b.id + '_' + (i + 1), kind: 'gap', b, gi: i, a: g.a, opts: g.opts || b.sentences, tag: g.tag, dom: sec.dom !== 'SG' ? sec.dom : null, exp: g.exp, q: 'Lücke ' + (i + 1) + ': ' + clozeContext(b.text, i + 1), sentences: !!b.sentences });
    });
  });
  return out;
}
function tagLabel(day, t) { return (day.tags[t] && day.tags[t].label) || t; }
function secDone(sec) {
  const d = D();
  if (sec.kind === 'cards') return Object.keys(d.vocab).length >= sec.words.length;
  if (sec.kind === 'quiz') return !!d.secs[sec.id];
  if (sec.kind === 'write') return !!d.write.submitted;
  if (sec.kind === 'speak') return !!d.speak.done;
  if (sec.kind === 'wrap') return !!d.closed;
  if (sec.kind === 'review') return srsQueue(curDay().no).every(it => d.rev[it.k]);
  return false;
}
function secPart(sec) {
  const d = D();
  if (sec.kind === 'cards') { const n = Object.keys(d.vocab).length; return n && n < sec.words.length ? n + '/' + sec.words.length : ''; }
  if (sec.kind === 'quiz') { const its = itemsOf(sec); const n = its.filter(i => d.res[i.id] || (sec.mock && d.sel[i.id] !== undefined)).length; return n && n < its.length ? n + '/' + its.length : ''; }
  if (sec.kind === 'write') return (d.write.text || '').trim() && !d.write.submitted ? 'taslak' : '';
  if (sec.kind === 'speak') return Object.keys(d.speak.checks || {}).length && !d.speak.done ? 'taslak' : '';
  if (sec.kind === 'review') { const q = srsQueue(curDay().no), n = q.filter(it => d.rev[it.k]).length; return n && n < q.length ? n + '/' + q.length : ''; }
  return '';
}
function secStatus(sec) {
  const d = D();
  if (secDone(sec)) { const s = d.secs[sec.id]; if (sec.kind === 'review') { const q = srsQueue(curDay().no); return { st: 'done', txt: q.length ? q.filter(it => d.rev[it.k] === 'know').length + '/' + q.length : '✓' }; } return { st: 'done', txt: sec.kind === 'quiz' && s ? s.ok + '/' + s.total : '✓' }; }
  const p = secPart(sec); return { st: p ? 'part' : 'none', txt: p };
}
function finalizeSec(sec) {
  const d = D(), items = itemsOf(sec), had = !!d.secs[sec.id];
  if (items.length && items.every(it => d.res[it.id])) {
    const ok = items.filter(it => d.res[it.id].ok).length; d.secs[sec.id] = { ok, total: items.length, ts: Date.now() };
    if (!had) { const xp = secXP(sec, d.secs[sec.id]); setTimeout(() => celebrate(ok === items.length ? 'Fehlerfrei!' : sec.mock ? 'Abgegeben!' : 'Geschafft!', '+' + xp + ' XP · ' + ok + '/' + items.length + ' richtig'), 80); }
  }
}
function mockLive(sec) { return !!(sec && sec.mock && !D().secs[sec.id]); }
function mockPts(sec) { const d = D(), s = d.secs[sec.id], p = sec.mock.pts || 1, n = itemsOf(sec).length; return { ok: s ? s.ok : 0, n, pts: s ? s.ok * p : 0, max: n * p, t: d.mockT[sec.id] || 0, done: !!s }; }
function hasSector(day) { return day.sections.some(s => s.dom === 'S' || (s.dom === 'SG' && s.kind !== 'cards' && s.kind !== 'review' && s.kind !== 'wrap')) || day.sections.some(s => s.kind === 'cards' && s.words.some(w => w.dom === 'S')); }
function minsOf(day, pred) { return day.sections.reduce((a, s) => a + (pred(s) ? s.min : 0), 0); }
function splitMins(day) {
  let S = 0, G = 0;
  day.sections.forEach(s => { if (s.dom === 'S') S += s.min; else if (s.dom === 'G') G += s.min; else { S += s.min / 2; G += s.min / 2; } });
  return { S, G };
}
function wordCount(t) { return (t.trim().match(/\S+/g) || []).length; }
function barClass(p) { return p >= 75 ? '' : (p >= 55 ? ' mid' : ' low'); }
function fmtMin(sec) { return Math.round(sec / 60); }

function summary(id) {
  const day = DAYS[id], d = D(id);
  const out = { scores: {}, total: [0, 0], wrong: [], tags: {}, vocabNew: [], open: [], byExam: {}, byDom: { S: [0, 0], G: [0, 0] }, time: {}, minutes: 0, mock: {} };
  day.sections.forEach(sec => {
    out.time[sec.id] = Math.round((d.time[sec.id] || 0) / 60 * 10) / 10;
    out.minutes += (d.time[sec.id] || 0) / 60;
    if (sec.kind === 'quiz') {
      const items = itemsOf(sec);
      const s = d.secs[sec.id];
      if (!s) { out.open.push(sec.id); }
      if (sec.mock) { const p = sec.mock.pts || 1; out.mock[sec.id] = { label: sec.mock.label, ok: s ? s.ok : null, n: items.length, pts: s ? s.ok * p : null, max: items.length * p, t: Math.round((d.mockT[sec.id] || 0) / 6) / 10, plan: sec.min }; }
      out.scores[sec.id] = s ? [s.ok, s.total] : null;
      items.forEach(it => {
        const r = d.res[it.id]; if (!r) return;
        out.total[1]++; if (r.ok) out.total[0]++;
        const ex = out.byExam[sec.exam] = out.byExam[sec.exam] || [0, 0]; ex[1]++; if (r.ok) ex[0]++;
        if (it.dom && out.byDom[it.dom]) { out.byDom[it.dom][1]++; if (r.ok) out.byDom[it.dom][0]++; }
        if (!r.ok) {
          out.wrong.push({ id: it.id, sec: sec.id, exam: sec.exam, dom: it.dom, q: String(it.q).slice(0, 170), chosen: r.c >= 0 ? (it.letters ? it.opts[r.c] : (it.sentences ? LET[r.c] + ') ' + it.opts[r.c] : it.opts[r.c])) : null, correct: it.sentences ? LET[it.a] + ') ' + it.opts[it.a] : it.opts[it.a], tag: it.tag });
          out.tags[it.tag] = (out.tags[it.tag] || 0) + 1;
        }
      });
    } else if (sec.kind === 'cards') {
      sec.words.forEach((w, i) => { if (isNewMark(d, i)) out.vocabNew.push(w.de); });
      if (Object.keys(d.vocab).length < sec.words.length) out.open.push(sec.id);
    } else if (sec.kind === 'review') {
      const q = srsQueue(day.no);
      out.rev = { due: q.length, know: q.filter(it => d.rev[it.k] === 'know').length, again: q.filter(it => d.rev[it.k] === 'again').map(it => it.w.de + ' (Tag ' + it.origin + ')'), open: q.filter(it => !d.rev[it.k]).length };
      if (out.rev.open) out.open.push(sec.id);
    } else if (sec.kind === 'write') {
      if (!d.write.submitted) out.open.push(sec.id);
      out.writeWords = wordCount(d.write.text || ''); out.writeChecks = Object.values(d.write.checks || {}).filter(Boolean).length;
    } else if (sec.kind === 'speak') {
      if (!d.speak.done) out.open.push(sec.id);
      out.speakRating = d.speak.rating || null; out.speakSecs = d.speak.secs || null;
    } else if (sec.kind === 'wrap') { if (!d.closed) out.open.push(sec.id); }
  });
  out.minutes = Math.round(out.minutes);
  return out;
}

/* ---------- speech ---------- */
const SAY = [], SCRIPTS = [];
function sayIdx(t) { SAY.push(t); return SAY.length - 1; }
function germanVoices() { try { return speechSynthesis.getVoices().filter(v => /^de/i.test(v.lang)); } catch (e) { return []; } }

let TOTAL_DAYS = 90;

function todayKey(t) { const d = t ? new Date(t) : new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function secXP(sec, s) { const n = s.total || 1; return 25 + (s.ok || 0) * 10 + (sec && sec.mock && s.ok / n >= 0.6 ? 50 : 0); }
function dayXP(id) {
  const d = state.days[id]; if (!d) return 0;

  if (t.classList.contains('wchk')) { const w = D().write; w.checks = w.checks || {}; w.checks[t.dataset.i] = t.checked; queueSave(); return; }

document.addEventListener('keydown', e => {

  if (sec.kind === 'quiz' && sec.mode === 'single') {
    const k = LET.indexOf(e.key.toLowerCase());

      const b = mcs[qi]; if (b && b.opts[k] !== undefined) { pick(sec.id + '_' + b.id, k); e.preventDefault(); }

    else if (e.key === 'ArrowRight') { const n = $('[data-m="new"]'); if (n) { n.click(); e.preventDefault(); } }

function mergePartner(raw) {
  try {
    const p = JSON.parse(raw || 'null'); if (!p || !p.days) return false; let ch = false;
    Object.entries(p.days).forEach(([id, v]) => {
      if (!v || !v.partner) return; const d = state.days[id] || (state.days[id] = {});
      if (JSON.stringify(d.partner || []) !== JSON.stringify(v.partner)) { d.partner = v.partner; ch = true; }
      if (v.speak && v.speak.done && !(d.speak && d.speak.done)) { d.speak = Object.assign({}, d.speak || {}, v.speak); ch = true; }
    });
    state.log = state.log || {};
    Object.entries(p.log || {}).forEach(([k, v]) => { if ((+v || 0) > (state.log[k] || 0)) { state.log[k] = +v; ch = true; } });
    return ch;
  } catch (e) { return false; }
}
